name: CI - Comprehensive Quality & Security Gate

on:
  push:
    branches: [master, main, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish package.json version to npm (needs approval in the npm environment)'
        type: boolean
        default: false
      dry_run:
        description: 'npm publish --dry-run (nothing reaches the registry)'
        type: boolean
        default: true
      tag_override:
        description: 'npm dist-tag (empty: latest, or next for a prerelease)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Code Syntax, File Integrity and Locale Parity Check
  syntax-and-lint:
    name: Code Syntax & Locale Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Integrity & Syntax Check (343+ JS files)
        run: npm run check

  # 2. Complete Unit & Integration Test Matrix across OS & Node versions
  test:
    name: Test Suite (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: syntax-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Run Test Suite (1690+ tests)
        run: npm test

  # 3. Security Audit & Dependency Scanning
  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

  # 4. Multi-Platform Native Executable (SEA) Build & Verification
  build-executable:
    name: Standalone Binary Build & Verify (${{ matrix.os }})
    needs: syntax-and-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Standalone Native Executable (Node SEA)
        run: npm run build:exe

      - name: Verify Executable in Isolated Environment
        run: npm run verify:exe

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crucix-bin-${{ matrix.os }}
          path: |
            bin/crucix*
          if-no-files-found: warn
          retention-days: 14

  # 5. Multi-Platform Executable Packaging & Master SHA-256 Checksums
  package-executables:
    name: Package Cross-Platform Binaries & SHA256
    needs: build-executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: crucix-bin-windows-latest
          path: dist-raw/windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: crucix-bin-ubuntu-latest
          path: dist-raw/ubuntu

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: crucix-bin-macos-latest
          path: dist-raw/macos

      - name: Consolidate Binaries & Generate SHA256SUMS.txt
        shell: bash
        run: |
          mkdir -p dist-release
          
          # Copy all distinct executable binaries and platform-specific names (excluding individual sha files)
          find dist-raw -type f \( -name "crucix-*" -o -name "crucix.exe" -o -name "crucix" \) ! -name "*.sha256" -exec cp {} dist-release/ \;
          
          cd dist-release
          chmod +x crucix* 2>/dev/null || true
          
          # Generate clean master SHA256SUMS.txt for all platform binaries
          sha256sum * > SHA256SUMS.txt
          
          echo "=========================================================="
          echo "    CROSS-PLATFORM CRUCIX EXECUTABLES & SHA-256 SUMS     "
          echo "=========================================================="
          cat SHA256SUMS.txt
          echo "=========================================================="

      - name: Upload Unified Cross-Platform Artifact with SHA
        uses: actions/upload-artifact@v4
        with:
          name: crucix-all-platforms-with-sha256
          path: dist-release/*
          retention-days: 30

      - name: Publish Executables & Checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Publishing multi-platform binaries and SHA256SUMS.txt to Release ${TAG} in repository ${GH_REPO}..."
          
          # If release exists, upload/clobber assets. If not, create the release with assets!
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists. Updating release assets..."
            gh release upload "${TAG}" dist-release/* --clobber
          else
            echo "Release ${TAG} does not exist yet. Creating release and uploading all assets..."
            gh release create "${TAG}" dist-release/* \
              --title "Crucix ${TAG}: Multi-Platform Standalone Binaries & SHA-256" \
              --generate-notes
          fi
          echo "Release ${TAG} assets successfully published!"

  # 6. Container & Docker Non-Root Permission Verification
  docker-verify:
    name: Docker Container & Non-Root Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t crucix-ci-test .

      - name: Verify Non-Root User & Volume Write Permissions
        run: |
          docker run --rm --entrypoint node crucix-ci-test -e "require('node:fs').writeFileSync('/app/runs/permission-test', 'ok'); if (process.getuid() === 0) process.exit(1); console.log('UID', process.getuid(), 'runs writable');"
          docker run --rm --entrypoint node crucix-ci-test scripts/verify-assets.mjs

  # 7. npm release: a v* tag, or a manual run with publish_npm. The "npm" environment holds NPM_ACCESS_TOKEN and should
  # require a reviewer, so nothing is published without an approval. Provenance comes from the id-token permission.
  publish-npm:
    name: Publish to npm
    needs: [syntax-and-lint, test, security-audit, package-executables]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/crucix
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Do not pass an npm access token: a classic 2FA login makes publish ask for an OTP.
      # Publish uses GitHub OIDC (id-token: write) as an npm Trusted Publisher.
      - name: Audit, check the version and publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        shell: bash
        run: |
          args=(--ci)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TAG_OVERRIDE" ]; then args+=(--tag "$TAG_OVERRIDE"); fi
          node scripts/publish-npm.mjs "${args[@]}"

  # 8. Central CI Gate (Summary check required for branch protection)
  ci-gate:
    name: CI Quality Gate (All Checks Passed)
    if: always()
    needs: [syntax-and-lint, test, security-audit, build-executable, package-executables, docker-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Upstream Job Results
        run: |
          echo "syntax-and-lint:     ${{ needs.syntax-and-lint.result }}"
          echo "test:                ${{ needs.test.result }}"
          echo "security-audit:      ${{ needs.security-audit.result }}"
          echo "build-executable:    ${{ needs.build-executable.result }}"
          echo "package-executables: ${{ needs.package-executables.result }}"
          echo "docker-verify:       ${{ needs.docker-verify.result }}"
          
          if [ "${{ needs.syntax-and-lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ] || \
             [ "${{ needs.build-executable.result }}" != "success" ] || \
             [ "${{ needs.package-executables.result }}" != "success" ] || \
             [ "${{ needs.docker-verify.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed!"
            exit 1
          fi
          echo "All quality, security, and multi-platform binary checks passed successfully!"
